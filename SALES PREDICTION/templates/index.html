<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Sales Forecasting</title>
  <style>
    body { background: #000; color: #fff; font-family: Arial, sans-serif; text-align: center; padding: 30px; }
    input { padding: 10px; margin: 5px; width: 200px; }
    button { padding: 10px 20px; margin: 10px; cursor: pointer; }
    .history { margin-top: 20px; }
    .error { color: red; margin-top: 15px; }
  </style>
</head>
<body>

<h1>Sales Forecasting</h1>

<form method="POST" action="{{ url_for('predict') }}">
  <input type="text" name="rate" placeholder="Rate" required /><br>
  <input type="text" name="sales_first_month" placeholder="Sales in First Month" required /><br>
  <input type="text" name="sales_second_month" placeholder="Sales in Second Month" required /><br>
  <button type="submit">Predict Sales</button>
</form>

{% if prediction_text %}
  <h2>{{ prediction_text }}</h2>
{% endif %}

{% if error %}
  <div class="error">{{ error }}</div>
{% endif %}

{% if history %}
  <div class="history">
    <h3>Prediction History:</h3>
    <ul>
      {% for h in history %}
        <li>${{ h }}</li>
      {% endfor %}
    </ul>
  </div>
{% endif %}

</body>
</html>

{% extends "base.html" %}

{% block title %}Login - Sales Forecasting{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-card animate-fade-in" style="width: 100%; max-width: 450px; padding: 3rem 2.5rem;">
        
        <div class="text-center mb-4">
            <div style="font-size: 3rem; margin-bottom: 1rem; color: var(--primary);">
                <i class="fa-solid fa-chart-pie"></i>
            </div>
            <h1 class="page-title text-gradient" style="font-size: 2rem;">Welcome Back</h1>
            <p class="text-muted">Sign in to access advanced forecasting tools</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}">
            <div class="form-group">
                <label class="form-label" for="username">Username</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" class="form-control" style="padding-left: 2.75rem;" placeholder="Enter your username" required>
                </div>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" for="password">Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-lock" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-control" style="padding-left: 2.75rem;" placeholder="Enter your password" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Login <i class="fa-solid fa-arrow-right ml-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted" style="font-size: 0.95rem;">
                Don't have an account? 
                <a href="{{ url_for('register') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">
                    Create one
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}

{% extends "base.html" %}

{% block title %}Register - Sales Forecasting{% endblock %}

{% block content %}
<div style="display: flex; justify-content: center; align-items: center; min-height: 80vh;">
    <div class="glass-card animate-fade-in" style="width: 100%; max-width: 450px; padding: 3rem 2.5rem;">
        
        <div class="text-center mb-4">
            <h1 class="page-title text-gradient" style="font-size: 2rem;">Create Account</h1>
            <p class="text-muted">Join the next-gen forecasting platform</p>
        </div>

        <form method="POST" action="{{ url_for('register') }}">
            <div class="form-group">
                <label class="form-label" for="username">Choose a Username</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-user-plus" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="text" id="username" name="username" class="form-control" style="padding-left: 2.75rem;" placeholder="e.g. data_wizard" required>
                </div>
            </div>
            
            <div class="form-group mb-4">
                <label class="form-label" for="password">Create a Password</label>
                <div style="position: relative;">
                    <i class="fa-solid fa-key" style="position: absolute; left: 1rem; top: 1rem; color: var(--text-muted);"></i>
                    <input type="password" id="password" name="password" class="form-control" style="padding-left: 2.75rem;" placeholder="Minimum 8 characters" required>
                </div>
            </div>
            
            <button type="submit" class="btn btn-primary btn-block">
                Sign Up <i class="fa-solid fa-user-check ml-2"></i>
            </button>
        </form>

        <div class="text-center mt-4">
            <p class="text-muted" style="font-size: 0.95rem;">
                Already have an account? 
                <a href="{{ url_for('login') }}" style="color: var(--primary); text-decoration: none; font-weight: 500;">
                    Log in
                </a>
            </p>
        </div>
    </div>
</div>
{% endblock %}
